name: 틱톡 매일 발행

# 클라우드 세션(claude.ai)이 죽어서 8/17~19 3일 연속 미발행이 난 뒤 만든 워크플로.
# 힉스필드 MCP를 HTTP로 직접 호출하므로 세션이 죽을 일이 없다. 인스타(ig_daily.yml)와 동일 구조.

on:
  schedule:
    # 2026-09-07: GitHub 크론이 일관되게 4~5시간 밀린다(실측: 9/3 4h21m, 9/4 4h08m, 9/7 4h19m).
    # 재시도를 촘촘히 걸어도 다 같이 밀려 소용이 없어, 예정 시각 자체를 4시간 앞당긴다.
    # 아래 KST 표기는 '지연 없이 돌았을 때'이고, 실제로는 4시간쯤 뒤에 나가는 것을 노린다.
    # 인스타와 같은 이유로 30분 간격 재시도. tiktok_posted 플래그로 중복 방지.
    # 2026-09-16: 발행일을 화·목·일로 바꿨다(UTC 요일 2,4,0 — 이 시간대는 UTC일 == KST일).
    # 요일 목록의 정본은 publish_days.py 이고, cron 은 여기서 같이 맞춘다.
    - cron: '30 6 * * 2,4,0'   # UTC 06:30 = KST 15:30 → 목표 19:30
    - cron: '0 7 * * 2,4,0'    # KST 16:00 → 목표 20:00
    - cron: '30 7 * * 2,4,0'   # KST 16:30 → 목표 20:30
    - cron: '30 8 * * 2,4,0'   # KST 17:30 → 목표 21:30
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1이면 실제 게시 없이 준비까지만'
        required: false
        default: '0'
      selftest:
        description: '1이면 인증·토큰회전·MCP 연결만 점검'
        required: false
        default: '0'
      target_date:
        description: '특정 날짜분을 올린다 (YYYY-MM-DD). 비우면 자동'
        required: false
        default: ''

permissions:
  contents: write
  issues: write   # 실패 알림 이슈 생성 (2026-09-22: 이게 없어 createIssue 가 거부됐다)

concurrency:
  group: tiktok-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install --quiet pillow

      - name: 오늘자 틱톡 발행
        env:
          HF_CLIENT_ID: ${{ secrets.HF_CLIENT_ID }}
          HF_REFRESH_TOKEN: ${{ secrets.HF_REFRESH_TOKEN }}
          # 24시간짜리 액세스 토큰 캐시 — 갱신 호출을 하루 1번으로 줄인다
          HF_ACCESS_TOKEN: ${{ secrets.HF_ACCESS_TOKEN }}
          HF_ACCESS_EXPIRES: ${{ secrets.HF_ACCESS_EXPIRES }}
          TIKTOK_CONNECTOR_ID: ${{ secrets.TIKTOK_CONNECTOR_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          SELFTEST: ${{ github.event.inputs.selftest }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
          # 갱신토큰은 1회용이라 매 실행 후 새 값을 시크릿에 되돌려 써야 한다
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python3 tt_publish.py

      # 인증이 깨지면 재시도 크론이 전부 같은 이유로 실패한다. 조용히 넘기지 말고 바로 알린다.
      - name: 실패 알림
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 발행 경로가 막힌 것(위젯 필수)과 인증 실패는 조치가 완전히 다르다 — 사유 파일로 구분한다.
          if [ "$(cat tiktok_block_reason.txt 2>/dev/null)" = "widget_required" ]; then
            TITLE="⛔ 틱톡 무인 발행 막힘 — 힉스필드 위젯 필수 ($(TZ=Asia/Seoul date +%F))"
            if ! gh issue list --state open --search "위젯 필수 in:title" --json title -q '.[].title' | grep -q "위젯 필수"; then
              gh issue create --title "$TITLE" --body "힉스필드 MCP 의 tiktok_publish 가 publish_token 을 요구합니다. 이 토큰은 사람이 발행 폼 위젯을 제출해야만 발급됩니다(2026-09-22부터). 이미지 업로드와 발행 준비까지는 정상입니다.

          당장은 오늘치 이미지를 틱톡 앱에서 직접 올리거나, 위젯을 지원하는 클라이언트(claude.ai 채팅 + 힉스필드 커넥터)에서 발행 폼을 제출해야 합니다.
          무인 발행을 되살리려면 힉스필드가 아닌 다른 경로가 필요합니다."
            fi
            exit 0
          fi
          TITLE="🔑 힉스필드 재인증 필요 ($(TZ=Asia/Seoul date +%F))"
          if ! gh issue list --state open --search "$TITLE in:title" --json title -q '.[].title' | grep -qF "$TITLE"; then
            gh issue create --title "$TITLE" --body "틱톡 발행이 인증 문제로 실패했습니다.

          갱신토큰은 1회용이라, 갱신 요청 응답이 유실되면 시크릿의 토큰이 죽습니다(2026-09-01 사고).

          조치: 맥에서 로컬 Claude 세션에 '힉스필드 재인증'이라고 요청하세요.
          python3 hf_auth.py 한 번이면 시크릿까지 자동 갱신됩니다."
          fi

      - name: 발행 기록 커밋
        if: github.event.inputs.dry_run != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_posts.json tiktok_publish.log tiktok_music.log
          git diff --staged --quiet || {
            git commit -m "✅ $(TZ=Asia/Seoul date +%F) 틱톡 발행 (Actions)"
            for i in 1 2 3; do git push && break || { git pull --rebase --autostash; sleep 3; }; done
          }
