name: 디자인짐 인스타 매일 발행

on:
  workflow_dispatch:  # 클라우드 루틴이 매일 19:36 KST에 호출 (주 경로)
    inputs:
      dry_run:
        description: '1이면 발행 없이 점검만'
        required: false
        default: ''
      target_date:
        description: '특정 날짜분을 올린다 (YYYY-MM-DD). 비우면 자동'
        required: false
        default: ''
  schedule:
    # GitHub 예약은 몇 시간씩 밀린다(8/27 10시간, 8/31 7시간 38분 → 새벽 발행).
    # 저녁 시간대를 잡으려고 30분 간격으로 여러 번 건다. 먼저 성공한 실행이 발행하고
    # 나머지는 ig_posted 플래그를 보고 스스로 빠진다(중복 없음).
    - cron: '30 9 * * 1-5'   # UTC 09:30 = KST 18:30 (본 슬롯)
    - cron: '0 10 * * 1-5'   # KST 19:00
    - cron: '30 10 * * 1-5'  # KST 19:30
    - cron: '30 11 * * 1-5'  # KST 20:30

permissions:
  contents: write

# 여러 크론이 겹쳐 돌면 플래그 커밋 전에 두 번 발행될 수 있다(8/14 중복 사고).
# 같은 그룹은 한 번에 하나만 돌고, 진행 중인 것을 취소하지 않는다.
concurrency:
  group: ig-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: 오늘자 발행
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: python server_ig_publish.py

      - name: posted 상태 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pending_posts.json
          git diff --staged --quiet && exit 0
          git commit -m "✅ $(TZ=Asia/Seoul date '+%Y-%m-%d') IG 발행 (Actions)"
          for i in 1 2 3; do
            git push && break
            git pull --rebase --autostash || git rebase --abort
            sleep 5
          done
