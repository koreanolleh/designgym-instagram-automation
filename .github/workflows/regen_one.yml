name: 컷 한 장만 다시 뽑기

# 반려는 보통 한 장에서 난다. weekly_generate 의 REGEN=1 은 그 주 8장을 통째로 다시
# 만들어 16크레딧을 쓰므로, 멀쩡한 컷까지 버리지 않도록 한 장짜리 교체 경로를 둔다.
# 교체 후 볼트 노트까지 다시 찍어 사장님 화면의 사진이 바로 바뀌게 한다.

on:
  workflow_dispatch:
    inputs:
      day:
        description: '요일 (Tuesday / Thursday / Sunday)'
        required: true
      slot:
        description: '그 날 몇 번째 사진인지 (1부터)'
        required: true
        default: '1'
      angle:
        description: 'weekly_prompts.json 의 앵글 키 (예: ang_stretch_in_hand)'
        required: true
      setup:
        description: '방도 바꿀 때만 setups 키. 비우면 그 날 쓰던 방 그대로'
        required: false
        default: ''
      dry:
        description: '1이면 프롬프트만 찍고 크레딧을 쓰지 않는다'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: weekly-generate      # 주간 생성과 같은 그룹 — 같은 파일을 동시에 건드리지 않는다
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install --quiet pillow

      - name: 컷 교체
        env:
          HF_CLIENT_ID: ${{ secrets.HF_CLIENT_ID }}
          HF_REFRESH_TOKEN: ${{ secrets.HF_REFRESH_TOKEN }}
          HF_ACCESS_TOKEN: ${{ secrets.HF_ACCESS_TOKEN }}
          HF_ACCESS_EXPIRES: ${{ secrets.HF_ACCESS_EXPIRES }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DAY: ${{ github.event.inputs.day }}
          SLOT: ${{ github.event.inputs.slot }}
          ANGLE: ${{ github.event.inputs.angle }}
          SETUP: ${{ github.event.inputs.setup }}
          DRY: ${{ github.event.inputs.dry }}
        run: python3 regen_one.py

      - name: 결과 커밋
        if: github.event.inputs.dry != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_posts.json images
          git diff --staged --quiet || {
            git commit -m "🔁 ${{ github.event.inputs.day }} ${{ github.event.inputs.slot }}번째 컷 교체 (${{ github.event.inputs.angle }})"
            for i in 1 2 3; do git push && break || { git pull --rebase --autostash; sleep 3; }; done
          }

      # 노트의 문구는 그대로 두고 사진 URL 만 갈아끼운다(KEEP_TEXT 기본값 = 보존).
      - name: 볼트 노트 다시 찍기
        if: github.event.inputs.dry != '1'
        env:
          VAULT_PUSH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$VAULT_PUSH_TOKEN" ]; then echo "::error::GH_PAT 없음"; exit 1; fi
          git clone --depth 1 "https://x-access-token:$VAULT_PUSH_TOKEN@github.com/koreanolleh/obsidian-vault.git" /tmp/vault \
            || { echo "::error::볼트 clone 실패"; exit 1; }
          OBSIDIAN_VAULT=/tmp/vault FORCE_NOTE=1 python3 make_weekly_note.py
          cd /tmp/vault
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A "03_프로젝트/디자인짐_콘텐츠_자동화/인스타_자동화/주간초안"
          if git diff --staged --quiet; then
            echo "볼트 변경 없음"
          else
            git commit -m "🔁 $(TZ=Asia/Seoul date +%F) 컷 교체 반영"
            for i in 1 2 3; do
              git push && { echo "✅ 볼트 push 완료"; exit 0; }
              git pull --rebase --autostash; sleep 3
            done
            echo "::error::볼트 push 3회 실패"; exit 1
          fi
