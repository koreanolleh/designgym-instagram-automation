name: (1회성) 2026-10-12 월요일 아침 밀린 일요일분 발행

# 2026-10-08 목요일분이 이미지 용량 문제로 3일 밀려 10/11 낮에 나갔다.
# 같은 날 저녁에 일요일분까지 나가면 너무 붙어서, 일요일분만 10/12 아침으로 한 번 미뤘다.
#
# ⚠️ 이번 한 번만이다. 다음 주부터는 다시 화·목·일이어야 하므로
#    - 이 워크플로는 날짜가 2026-10-12(KST)가 아니면 아무것도 하지 않고 끝난다
#    - 일이 끝나면 스스로를 저장소에서 지운다
#    - ig_daily / tiktok_daily 의 크론(화·목·일)은 건드리지 않았다
#
# 그리고 순서가 중요하다. weekly_generate 는 '아직 안 나간 지난주 게시물'이 있으면
# 덮어쓰지 않고 그냥 종료하는데, 그 크론은 일요일 밤에만 네 번 돈다.
# 월요일 발행이 그 네 번보다 늦으면 이번 주 생성이 통째로 건너뛰어진다.
# 그래서 여기서 발행을 끝낸 뒤 weekly_generate 를 직접 호출해 다음 주를 보장한다.

on:
  schedule:
    # 깃허브 크론은 4~5시간 밀린다(저장소 실측). 월요일 아침 8~9시 KST를 노려 4시간 앞당긴다.
    - cron: '0 19 * * 0'    # 지연 없으면 KST 월 04:00 → 실제로는 월 08~09시
    - cron: '0 20 * * 0'    # 위가 실패했을 때 백업
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: oneoff-20261012
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 날짜 확인 (2026-10-12 KST 가 아니면 종료)
        id: guard
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          if [ "$TODAY" != "2026-10-12" ]; then
            echo "오늘은 $TODAY — 이 1회성 작업의 날이 아니다. 아무것도 하지 않음"
            echo "go=0" >> "$GITHUB_OUTPUT"
          else
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 인스타 발행
        if: steps.guard.outputs.go == '1'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow run ig_daily.yml -f target_date=2026-10-12
          sleep 20
          RID=$(gh run list --workflow=ig_daily.yml --limit 1 --json databaseId -q '.[0].databaseId')
          gh run watch "$RID" --exit-status

      - name: 틱톡 발행
        if: steps.guard.outputs.go == '1'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow run tiktok_daily.yml -f target_date=2026-10-12
          sleep 20
          RID=$(gh run list --workflow=tiktok_daily.yml --limit 1 --json databaseId -q '.[0].databaseId')
          gh run watch "$RID" --exit-status

      # 발행이 끝나야 '밀린 게시물' 가드가 풀린다. 여기서 직접 불러 다음 주를 보장한다.
      - name: 다음 주 생성 호출
        if: steps.guard.outputs.go == '1'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh workflow run weekly_generate.yml

      # 남겨두면 다음 주에도 월요일에 뭔가 도는 것처럼 보인다. 일이 끝나면 지운다.
      - name: 스스로 삭제
        if: steps.guard.outputs.go == '1'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/oneoff_20261012.yml
          git commit -q -m "🧹 1회성 월요일 발행 워크플로 제거 (역할 끝남)"
          git push \
            "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git" HEAD:main
