name: 볼트에 주간초안 수동 반영
# 월요일 생성 때 볼트 반영이 실패했을 때 쓰는 복구용. 크레딧은 쓰지 않는다
# (이미 저장소에 있는 이미지/큐로 노트만 다시 만들어 push).
on: { workflow_dispatch: {} }
concurrency: { group: vault-sync, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 노트 생성 후 볼트 push
        env:
          VAULT_PUSH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$VAULT_PUSH_TOKEN" ]; then echo "::error::GH_PAT 없음"; exit 1; fi
          git clone --depth 1 "https://x-access-token:$VAULT_PUSH_TOKEN@github.com/koreanolleh/obsidian-vault.git" /tmp/vault \
            || { echo "::error::볼트 clone 실패"; exit 1; }
          OBSIDIAN_VAULT=/tmp/vault python3 make_weekly_note.py
          cd /tmp/vault
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A "03_프로젝트/디자인짐_콘텐츠_자동화/인스타_자동화/주간초안"
          if git diff --staged --quiet; then
            echo "변경 없음 — 볼트가 이미 최신입니다"
          else
            git commit -m "📝 $(TZ=Asia/Seoul date +%F) 주간초안 수동 반영"
            for i in 1 2 3; do
              git push && { echo "✅ 볼트 push 완료"; exit 0; }
              git pull --rebase --autostash; sleep 3
            done
            echo "::error::볼트 push 3회 실패"; exit 1
          fi
