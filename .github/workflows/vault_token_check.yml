name: 볼트 토큰 점검
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 실제 push 권한 확인 (dry-run)
        run: |
          for t in VAULT GH; do
            [ "$t" = VAULT ] && TOK="${{ secrets.VAULT_PUSH_TOKEN }}" || TOK="${{ secrets.GH_PAT }}"
            if [ -z "$TOK" ]; then echo "$t: 시크릿 없음"; continue; fi
            rm -rf /tmp/v && git clone -q --depth 1 \
              "https://x-access-token:$TOK@github.com/koreanolleh/obsidian-vault.git" /tmp/v 2>/dev/null \
              || { echo "$t: clone 실패"; continue; }
            out=$(cd /tmp/v && git push --dry-run 2>&1 | tail -2)
            echo "$t: $out"
          done
