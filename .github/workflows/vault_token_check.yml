name: 볼트 토큰 점검
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 두 토큰으로 볼트 접근 시도
        run: |
          for t in VAULT GH; do
            [ "$t" = VAULT ] && TOK="${{ secrets.VAULT_PUSH_TOKEN }}" || TOK="${{ secrets.GH_PAT }}"
            if [ -z "$TOK" ]; then echo "$t: 시크릿 없음"; continue; fi
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOK" \
                   https://api.github.com/repos/koreanolleh/obsidian-vault)
            push=$(curl -s -H "Authorization: Bearer $TOK" \
                   https://api.github.com/repos/koreanolleh/obsidian-vault | grep -o '"push": *[a-z]*' | head -1)
            echo "$t: repo 조회 $code / $push"
          done
