name: 틱톡 발행 감시

# 2026-08-20 개편: 발행 주체가 클라우드 세션 → GitHub Actions(tiktok_daily.yml)로 바뀌었다.
# 예전엔 "세션이 시작이라도 했는지"를 하트비트로 구분해야 했지만, 이제 발행 이력은
# Actions 실행 기록에 남는다. 그래서 오늘자 발행 여부 + 워크플로 실행 결과를 함께 본다.

on:
  schedule:
    - cron: '30 13 * * 1-5'  # UTC 13:30 = KST 22:30
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 오늘 틱톡 발행 여부 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export TODAY=$(TZ=Asia/Seoul date +%F)

          STATE=$(python3 - <<'PYEOF'
          import json, os
          today = os.environ['TODAY']
          d = json.load(open('pending_posts.json'))
          entry = next((p for p in d['posts'].values() if p.get('date') == today), None)
          if entry is None or entry.get('tiktok_posted'):
              print('ok')      # 오늘자 없음 or 이미 발행 = 정상
          else:
              print('missing')
          PYEOF
          )
          echo "판정: $STATE ($TODAY)"
          [ "$STATE" = "ok" ] && exit 0

          # 발행 워크플로가 오늘 어떻게 끝났는지 확인해 원인을 좁힌다
          RUN=$(gh run list --workflow=tiktok_daily.yml --limit 5 \
                --json conclusion,createdAt,url \
                -q "[.[] | select(.createdAt | startswith(\"${TODAY}\"))] | .[0]" 2>/dev/null)
          if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
            CAUSE="오늘 발행 워크플로가 실행되지 않았습니다 (GitHub 크론 지연 가능성)."
            FIX="수동 실행: gh workflow run tiktok_daily.yml"
          else
            CONC=$(echo "$RUN" | python3 -c "import sys,json;print(json.load(sys.stdin).get('conclusion'))")
            URL=$(echo "$RUN" | python3 -c "import sys,json;print(json.load(sys.stdin).get('url'))")
            CAUSE="발행 워크플로는 실행됐으나 결과가 '$CONC' 입니다: $URL"
            FIX="로그의 오류를 확인하세요. 인증 오류라면 로컬에서 'python3 hf_auth.py' 재인증 후 HF_REFRESH_TOKEN 시크릿을 갱신해야 합니다."
          fi

          TITLE="⚠️ $TODAY 틱톡 미발행"
          BODY="오늘자 틱톡 게시물이 발행되지 않았습니다.

          $CAUSE

          조치: $FIX"

          if ! gh issue list --state open --search "$TITLE in:title" --json title -q '.[].title' | grep -qF "$TITLE"; then
            gh issue create --title "$TITLE" --body "$BODY"
            echo "이슈 생성"
          else
            echo "이미 열린 이슈 있음"
          fi
