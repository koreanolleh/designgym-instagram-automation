name: 틱톡 발행 감시

on:
  schedule:
    - cron: '30 13 * * 1-5'  # UTC 13:30 = KST 22:30 (+지연) — 저녁 발행 확인용
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 오늘 틱톡 발행 여부 확인 (하트비트로 원인 구분)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)

          STATE=$(python3 - <<PYEOF
          import json, os
          today = "$TODAY"
          d = json.load(open('pending_posts.json'))
          entry = next((p for p in d['posts'].values() if p.get('date') == today), None)
          if entry is None:
              print('ok')            # 오늘자 게시물 없음 = 정상
          elif entry.get('tiktok_posted'):
              print('ok')
          else:
              hb = ''
              if os.path.exists('routine_heartbeat.log'):
                  hb = open('routine_heartbeat.log', encoding='utf-8').read()
              print('died' if (today + ' ' in hb and 'daily' in hb.split(today)[-1][:40]) else 'norun')
          PYEOF
          )
          echo "판정: $STATE ($TODAY)"
          [ "$STATE" = "ok" ] && exit 0

          if [ "$STATE" = "norun" ]; then
            TITLE="⚠️ $TODAY 틱톡 미발행 (루틴 미실행)"
            BODY="클라우드 루틴이 시작조차 못 했습니다(하트비트 없음). 클라우드 인프라 문제일 가능성이 큽니다.

          로컬 Claude 세션에 '틱톡 올려줘'라고 요청하면 1분 안에 복구됩니다."
          else
            TITLE="⚠️ $TODAY 틱톡 발행 확인 필요 (루틴 중단)"
            BODY="루틴이 시작(하트비트)은 했지만 완료 기록이 없습니다. 두 가지 가능성이 있습니다:
          1. 게시 전에 중단 → 실제 미발행
          2. 게시 후 기록 전에 중단 → 실제로는 올라가 있음 (과거 8/6·8/7 사례)

          틱톡 계정을 먼저 확인하고, 없으면 로컬 Claude 세션에 복구를 요청하세요."
          fi

          if ! gh issue list --state open --search "$TITLE in:title" --json title -q '.[].title' | grep -qF "$TITLE"; then
            gh issue create --title "$TITLE" --body "$BODY"
            echo "이슈 생성"
          else
            echo "이미 열린 이슈 있음"
          fi
